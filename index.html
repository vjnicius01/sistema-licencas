<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Licenças</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    
    nav {
      background: #1a1d2e;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2d3154;
    }
    .nav-logo { font-size: 18px; font-weight: 700; color: #6366f1; }
    .nav-links { display: flex; gap: 8px; }
    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }
    .nav-links a:hover { background: #2d3154; color: #e2e8f0; }
    .nav-links a.active { background: #6366f1; color: white; }
    .btn-sair {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-sair:hover { background: #ef4444; color: white; }

    .container { max-width: 900px; margin: 40px auto; padding: 0 24px; }
    
    .hero {
      background: linear-gradient(135deg, #1a1d2e, #2d3154);
      border-radius: 16px;
      padding: 40px;
      margin-bottom: 32px;
      border: 1px solid #2d3154;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .hero img { width: 180px; border-radius: 12px; }
    .hero h1 { font-size: 26px; font-weight: 700; color: #f1f5f9; margin-bottom: 12px; }
    .hero p { color: #94a3b8; line-height: 1.7; font-size: 15px; }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .card {
      background: #1a1d2e;
      border: 1px solid #2d3154;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    .card-icon { font-size: 32px; margin-bottom: 12px; }
    .card-title { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    .card-value { font-size: 28px; font-weight: 700; color: #6366f1; }

    .section-title { font-size: 16px; font-weight: 600; color: #f1f5f9; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #2d3154; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem('logado') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <nav>
    <div class="nav-logo">🔐 SisLicenças</div>
    <div class="nav-links">
      <a href="index.html" class="active">Início</a>
      <a href="licencas.html">Licenças</a>
      <a href="cadastro.html">Cadastrar Usuário</a>
    </div>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </nav>

  <div class="container">
    <div class="hero">
      <img src="imagem.png" alt="Licenças">
      <div>
        <h1>Registro e Controle de Licenças</h1>
        <p>Gerencie todas as licenças de operação, ambientais e permissões da sua empresa em um só lugar.</p>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-icon">📋</div>
        <div class="card-title">Total de Licenças</div>
        <div class="card-value" id="totalLicencas">0</div>
      </div>
      <div class="card">
        <div class="card-icon">✅</div>
        <div class="card-title">Licenças Ativas</div>
        <div class="card-value" style="color:#22c55e" id="licencasAtivas">0</div>
      </div>
      <div class="card">
        <div class="card-icon">⚠️</div>
        <div class="card-title">A Vencer</div>
        <div class="card-value" style="color:#f59e0b" id="licencasVencer">0</div>
      </div>
    </div>

    <div class="section-title">Ações Rápidas</div>
    <a href="licencas.html" class="btn">Ver Licenças</a>
  </div>

  <script>
    function sair() {
      localStorage.removeItem('logado');
      window.location.href = 'login.html';
    }
    const licencas = JSON.parse(localStorage.getItem('licencas') || '[]');
    document.getElementById('totalLicencas').textContent = licencas.length;
    document.getElementById('licencasAtivas').textContent = licencas.filter(l => l.status === 'ativa').length;
    document.getElementById('licencasVencer').textContent = licencas.filter(l => l.status === 'vencer').length;
  </script>
</body>
</html>
